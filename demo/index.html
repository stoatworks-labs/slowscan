  <body>
    <main id="demo">
      <noscript>
        <h1>Slowscan</h1>
        <p>
          An FFGL effect that sends your clip as slow-scan television (Martin
          M1, Scottie S1 or Robot 36 tones) through an HF channel with noise,
          fading, multipath and interference, and paints whatever the receiver
          manages to decode, a line at a time. The slant from a receiver clock a
          few ppm out, the colour fringes on it, the noise streaks below the FM
          threshold and the smear all come from the chain running at 11,025
          samples a second. None of it is drawn on top.
        </p>
        <p>
          This demo runs the plugin's shaders and a port of its signal chain in
          your browser, so it needs JavaScript and WebGL2. The plugin itself,
          its source and its downloads are on
          <a href="https://github.com/stoatworks-labs/slowscan">its repository</a>.
        </p>
        <ul>
          <li><a href="https://stoatworks-labs.com/software/slowscan/">Project page and downloads</a></li>
          <li><a href="https://stoatworks-labs.com/software/slowscan/guide/">User guide</a></li>
          <li><a href="https://github.com/stoatworks-labs/slowscan">Source on GitHub</a></li>
        </ul>
      </noscript>
    </main>
